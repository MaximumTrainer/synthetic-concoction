# Local / self-hosted Fabricate: API + PostgreSQL in one command (#60 §6, #61 §8).
#
#   cp .env.example .env      # fill in FABRICATE__BootstrapApiKey and your LLM key
#   docker compose up --build
#
# The shape matches the hosted deployments (PostgreSQL, secrets by environment variable), so what works here works on
# Fly/Render. SQLite is for tests only and is deliberately not used here.
services:
  api:
    build: .
    ports:
      # Host port is configurable because 8080 is commonly already taken; the container port is fixed.
      - "${FABRICATE_HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FABRICATE_DB_PROVIDER: postgres
      FABRICATE_CONNECTION_STRING: "Host=db;Port=5432;Database=fabricate;Username=fabricate;Password=${POSTGRES_PASSWORD:-fabricate}"
      # Data Protection key ring in the database, matching fly.toml (#76). This file exists to be the same shape
      # as the hosted deployment, and a key ring on a container filesystem is the one place it used to differ:
      # there it is lost with the machine, taking the ability to decrypt every stored credential with it.
      FABRICATE_DATA_PROTECTION_KEY_STORE: database
      FABRICATE_DATA_PROTECTION_ALLOW_UNWRAPPED: "true"
    depends_on:
      db:
        condition: service_healthy
    # Readiness: GET http://localhost:8080/healthz from the host (the runtime image ships no curl/wget).

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fabricate
      POSTGRES_USER: fabricate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabricate}
    volumes:
      - fabricate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabricate -d fabricate"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: the database is reachable only from the api service.

volumes:
  fabricate-db:
